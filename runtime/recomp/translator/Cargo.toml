[package]
name = "doodle-recompile"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
capstone = { version = "0.14", default-features = false, features = ["std", "full", "arch_arm"] }
goblin = { version = "0.10", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
